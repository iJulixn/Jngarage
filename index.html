<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:250px;
}
input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:10px;
    background:#38bdf8;
    border:none;
    border-radius:8px;
    font-weight:bold;
}
</style>
</head>
<body>
<div class="box">
<h3>🔐 Login</h3>
<form method="POST">
<input name="user" placeholder="Usuario">
<input name="password" type="password" placeholder="Contraseña">
<button>Entrar</button>
</form>
</div>
</body>
</html>
