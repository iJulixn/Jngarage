<!DOCTYPE html>
<html>
<head>
    <title>JN Garage</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .card {
            background: #1e293b;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .clientes {
            background: #020617;
            padding: 10px;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<h1>🚗 JN Garage Detail</h1>

<form method="POST">
    <select name="cliente">
        <option value="">Seleccionar cliente</option>
        {% for c in clientes %}
            <option value="{{c[0]}}">{{c[0]}}</option>
        {% endfor %}
    </select>

    <input type="text" name="cliente" placeholder="O escribir nuevo cliente">

    <input type="text" name="auto" placeholder="Auto">
    
    <select name="servicio">
        <option>Lavado básico</option>
        <option>Pulido</option>
    </select>

    <input type="number" name="precio" placeholder="Precio">

    <button>Guardar</button>
</form>

<h2>💰 Total: ${{total}}</h2>
<h3>✔ Pagados: ${{pagados}}</h3>
<h3>⏳ Pendientes: ${{pendientes}}</h3>

<hr>

{% for d in datos %}
<div class="card">
    {{d[1]}} - {{d[2]}} - ${{d[4]}} - {{d[5]}}
</div>
{% endfor %}

<hr>

<div class="clientes">
<h3>👤 Clientes</h3>

{% for c in clientes %}
<div>
    {{c[0]}}
    <a href="/borrar_cliente/{{c[0]}}" style="color:red">❌</a>
</div>
{% endfor %}

</div>

<br>
<a href="/logout" style="color:red">Cerrar sesión</a>

</body>
</html>
