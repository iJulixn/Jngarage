<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background:#0f172a; color:white; font-family:Arial; margin:0; }
.header { background:#020617; padding:15px; text-align:center; color:#38bdf8; }
.container { padding:15px; }

input, select {
    width:100%;
    padding:12px;
    margin:5px 0;
    border:none;
    border-radius:10px;
    background:#1e293b;
    color:white;
}

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    font-weight:bold;
}

.card {
    background:#1e293b;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
}

.stats {
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.stat {
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    width:48%;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">🚗 JN Garage Detail</div>

<div class="container">

<form method="POST">
<input name="cliente" placeholder="Cliente">
<input name="auto" placeholder="Auto">
<select name="tipo">
<option>Lavado básico</option>
<option>Lavado premium</option>
<option>Pulido</option>
</select>
<input name="precio" placeholder="Precio">
<button>Guardar</button>
</form>

<div class="stats">
<div class="stat">Hoy 💰 ${{total_dia}}</div>
<div class="stat">Mes 📊 ${{total_mes}}</div>
</div>

{% for d in datos %}
<div class="card">
<b>{{d[2]}}</b> - {{d[3]}}<br>
{{d[4]}}<br>
💲{{d[5]}}<br>
<a href="/ticket/{{d[0]}}" style="color:#38bdf8">📄 Ticket PDF</a>
</div>
{% endfor %}

<br>
<a href="/pagar/{{d[0]}}" style="color:lime">
💳 Pagar
</a>

<a href="/logout">Cerrar sesión</a>

</div>

</body>
</html>
